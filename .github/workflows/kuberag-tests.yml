name: KubeRAG API Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "kuberag-monitor/**"
      - ".github/workflows/kuberag-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "kuberag-monitor/**"
      - ".github/workflows/kuberag-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kuberag-monitor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Audit Python dependencies
        # Temporary exceptions:
        # PYSEC-2026-311: ChromaDB 1.5.9, no fix currently available.
        # PYSEC-2026-3552: cryptography requires 50.0.0, but MLflow 3.15.1 requires cryptography<50.
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3552

      - name: Run API tests with coverage
        run: python -m pytest tests/test_api.py --cov=app.main --cov-report=term-missing --cov-fail-under=80 -v
