name: KubeRAG API Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "kuberag-monitor/**"
      - ".github/workflows/kuberag-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "kuberag-monitor/**"
      - ".github/workflows/kuberag-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kuberag-monitor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Audit Python dependencies
        # Temporary dependency security exceptions:
        # ChromaDB vulnerabilities currently have no fixed release.
        # Remove these exceptions when a patched ChromaDB version is available.
        # PYSEC-2026-3552 remains temporarily ignored because
        # cryptography 50.0.0 conflicts with MLflow 3.15.1.
        run: >
          python -m pip_audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833

      - name: Run API tests with coverage
        run: python -m pytest tests/test_api.py --cov=app.main --cov-report=term-missing --cov-fail-under=80 -v

      - name: Build KubeRAG Docker image
        run: docker build -t kuberag-ci-test .

      - name: Scan KubeRAG Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kuberag-ci-test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: kuberag-monitor/.trivyignore

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: >
          kubeconform
          -strict
          -summary
          -skip ServiceMonitor
          k8s/
