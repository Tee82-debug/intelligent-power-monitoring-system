apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: kuberag

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
      - name: ollama

        image: ollama/ollama:latest

        ports:
        - containerPort: 11434

        resources:
          requests:
            memory: "1Gi"
            cpu: "300m"

          limits:
            memory: "2Gi"
            cpu: "1500m"
