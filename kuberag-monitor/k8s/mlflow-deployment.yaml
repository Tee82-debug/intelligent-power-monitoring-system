apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: kuberag

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      containers:
      - name: mlflow

        image: ghcr.io/mlflow/mlflow:v3.1.1

        command: ["mlflow"]
        args:
        - server
        - --host=0.0.0.0
        - --port=5000

        ports:
        - containerPort: 5000

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
